name: Deploy project website
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "*.md"
      - "docs/**"
      - "examples/**"
      - "scripts/check-docs.py"
      - "scripts/build-website.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "*.md"
      - "docs/**"
      - "examples/**"
      - "scripts/check-docs.py"
      - "scripts/build-website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation links and translations
        run: python3 scripts/check-docs.py
      - name: Validate and build website
        run: python3 scripts/build-website.py
      - name: Check JavaScript syntax
        run: node --check website/site.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
