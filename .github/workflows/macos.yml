name: macOS build and draft release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Install frontend dependencies
        run: npm ci
      - name: Check versions
        run: npm run check:version
      - name: Test lifecycle and manifests
        run: npm test
      - name: Build macOS distributables
        id: build
        run: |
          npm run release:mac
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-macOS-arm64
          path: release/${{ steps.build.outputs.version }}/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flint-macOS-arm64
          path: release-assets
      - name: Create a draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true || { echo 'Refusing to modify an already published release'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --title "Flint $TAG" --notes-file docs/EN/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" release-assets/* --clobber
