name: 问题反馈
description: 报告安装、启动、停止或界面问题
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Flint 版本
      placeholder: 0.1.5
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS 版本与芯片
      placeholder: macOS 15 / Apple M3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请删去 API Key、个人文件路径、文献内容及其他隐私信息。
      render: text
